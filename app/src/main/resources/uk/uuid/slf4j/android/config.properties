# Configuration for uk.uuid.slf4j:slf4j-android
# https://github.com/nomis/slf4j-android

# The default is NATIVE, as determined by `android.util.Log.isLoggable`, which defaults to INFO
level.com.ubergeek42.weechat.relay=VERBOSE

# Defaults to logger name. It can be prepended to the message instead.
tag.com.ubergeek42.weechat.relay=App/Relay

# Whether to show the logger name in the beginning of the message.
# `short` amounts to the simple class name.
# Possible values: false|short|compact|long|caller
showName=short

# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
#org.gradle.jvmargs=-Xmx1536m

# This hopefully will get rid of the OOM errors while building
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
#org.gradle.parallel=true

android.enableR8.fullMode=true

# When set to true, the Android plugin automatically migrates existing third-party libraries to use
# AndroidX by rewriting their binaries. The flag is false by default if it is not specified.
android.useAndroidX=true

# Add the following to ~/.gradle/gradle.properties to build dev/release

# Key info for creating the development release in the android market
#devStorefile=/path/to/keystore
#devStorePassword=keystorepassword
#devKeyAlias=devkeyalias
#devKeyPassword=devkeypassword

# Key info for creating real releases
#releaseStorefile=/path/to/keystore
#releaseStorePassword=keystorepassword
#releaseKeyAlias=releasekeyalias
#releaseKeyPassword=releasekeypassword

# kapt is the annotation processor for Kotlin
kapt.incremental.apt=true

android.nonTransitiveRClass=true

android.r8.optimizedResourceShrinking=true

# The below settings were added, uncommented, by the AGP upgrade assistant in Android Studio.

#android.defaults.buildfeatures.resvalues=true
#android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
#android.builtInKotlin=false

# The below setting needs to stay for the cats to work. Without it, the below error occurs.
# The ability to opt-out will be removed in AGP 10.0, mid-2026.
# See https://developer.android.com/build/releases/agp-9-0-0-release-notes#android-gradle-plugin-new-dsl
#
#   Failed to apply plugin 'com.ibotta.gradle.aop'.
#   > class com.android.build.gradle.internal.dsl.ApplicationExtensionImpl$AgpDecorated_Decorated
#   cannot be cast to class com.android.build.gradle.BaseExtension
#   (com.android.build.gradle.internal.dsl.ApplicationExtensionImpl$AgpDecorated_Decorated and
#   com.android.build.gradle.BaseExtension are in unnamed module of loader
#   org.gradle.internal.classloader.VisitableURLClassLoader$InstrumentingVisitableURLClassLoader)
android.newDsl=false